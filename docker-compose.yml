services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse_owner
      POSTGRES_PASSWORD: pulse_owner
    ports:
      - '5432:5432'
    volumes:
      - pulse_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d

volumes:
  pulse_pgdata:
